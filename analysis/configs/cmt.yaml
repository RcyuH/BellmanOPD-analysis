# Optional overlay for a future CMT training run. Do not apply to an old run.
analysis:
  enabled: true
  output_dir: analysis
  tensorboard: true
  log_every_n_steps: 10
  save_token_statistics: true
  save_every_n_steps: 100
  measure_learning_progress: true
  learning_progress_every_n_steps: 100
  num_sequences_to_track: 2
  num_tokens_per_sequence: 8
  max_probe_response_position: 512
  downstream_window_tokens: 32
  save_full_logits: false
